<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CognitiveVault — Universal RAG Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo+Play:wght@200..1000&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik+Storm&display=swap" rel="stylesheet">

    <!-- Custom styles -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Toast Notification Container -->
    <div id="toast-root" aria-live="polite" aria-atomic="false"></div>

    <!-- COLUMN 1: Collections Sidebar -->
    <aside class="w-1/4 bg-[#f0ebe1] border-r border-[#e6dfd5] flex flex-col p-5">
        <div class="flex items-center space-x-3 mb-6">
            <span class="text-2xl">🛡️</span>
            <h1 class="font-bold text-lg text-[#2c2522]">CognitiveVault</h1>
        </div>

        <div class="mb-4">
            <label class="block border-2 border-dashed border-[#dcd3c9] hover:border-[#4f46e5] rounded-xl p-4 text-center cursor-pointer bg-white transition">
                <span class="text-sm font-medium text-[#5c524b]">📁 + Add documents</span>
                <span class="block text-xs text-gray-400 mt-1">PDF, Excel, Word, CSV, MD</span>
                <input type="file" id="fileInput" class="hidden" multiple accept=".pdf,.docx,.xlsx,.csv,.md" onchange="uploadFiles(this.files)">
            </label>
        </div>

        <div class="mt-4 flex-1 overflow-y-auto">
            <h2 class="text-xs font-semibold text-[#8c7a6b] tracking-wider mb-3">ACTIVE SOURCES</h2>
            <div id="fileList" class="space-y-2">
                <!-- Dynamically loaded files -->
            </div>
        </div>
    </aside>

    <!-- COLUMN 2: Main Chat Interface -->
    <main class="flex-1 flex flex-col bg-[#f7f3ed] border-r border-[#e6dfd5]">
        <header class="p-6 border-b border-[#e6dfd5] bg-white/50 backdrop-blur">
            <h2 class="text-xl font-semibold text-[#2c2522]">Ask across everything</h2>
            <p class="text-xs text-[#7a6e65] mt-1">Universal RAG assistant powered by local vector embeddings & OpenRouter</p>
        </header>

        <!-- Chat History Feed -->
        <div id="chatFeed" class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="text-center text-gray-400 my-auto">
                <p class="text-sm">Upload documents on the left and ask questions below.</p>
            </div>
        </div>

        <!-- Chat Input Bar -->
        <div class="p-4 bg-white border-t border-[#e6dfd5]">
            <form onsubmit="sendQuery(event)" class="flex items-center bg-[#f7f3ed] border border-[#dcd3c9] rounded-full px-4 py-2 shadow-sm focus-within:ring-2 focus-within:ring-[#4f46e5]">
                <input type="text" id="queryInput" placeholder="Ask your documents anything..." class="flex-1 bg-transparent border-none outline-none text-sm text-[#2c2522] placeholder-gray-400 px-2">
                <button type="submit" class="bg-[#4f46e5] text-white p-2 rounded-full hover:bg-indigo-700 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </form>
        </div>
    </main>

    <!-- COLUMN 3: Source Inspector Panel -->
    <aside class="w-1/4 bg-[#f0ebe1] flex flex-col p-5">
        <h3 class="font-semibold text-sm text-[#2c2522] mb-4">Source Inspector</h3>
        <div id="sourceInspector" class="flex-1 bg-white border border-[#e6dfd5] rounded-xl p-4 overflow-y-auto text-xs text-[#5c524b] shadow-sm">
            <p class="text-gray-400 italic text-center mt-20">Click or trigger a query to inspect cited text chunks and relevance scores here.</p>
        </div>
    </aside>

    <script>
        // ===== Helpers =====
        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        const INSPECTOR_PLACEHOLDER = '<p class="text-gray-400 italic text-center mt-20">Click or trigger a query to inspect cited text chunks and relevance scores here.</p>';

        // ===== Custom Toast System =====
        const TOAST_ICONS = { success: '✓', error: '!', info: 'i', loading: '↻' };

        function showToast({ type = 'info', title, message = '', duration = 4000 }) {
            const root = document.getElementById('toast-root');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.setAttribute('role', type === 'error' ? 'alert' : 'status');

            el.innerHTML = `
                <div class="toast-icon">${TOAST_ICONS[type]}</div>
                <div class="toast-body">
                    <div class="toast-title"></div>
                    <div class="toast-msg"></div>
                </div>
                <button class="toast-close" aria-label="Dismiss">×</button>
                ${duration ? `<div class="toast-bar" style="animation-duration:${duration}ms"></div>` : ''}
            `;
            // textContent avoids injecting HTML from file names or server errors
            el.querySelector('.toast-title').textContent = title;
            el.querySelector('.toast-msg').textContent = message;

            let timer;
            const close = () => {
                clearTimeout(timer);
                el.classList.add('leaving');
                el.addEventListener('animationend', () => el.remove(), { once: true });
            };

            el.querySelector('.toast-close').onclick = close;
            if (duration) timer = setTimeout(close, duration);

            root.appendChild(el);

            return {
                close,
                update({ type: t, title: ti, message: m = '', duration: d = 4000 }) {
                    clearTimeout(timer);
                    el.className = `toast ${t}`;
                    el.setAttribute('role', t === 'error' ? 'alert' : 'status');
                    el.querySelector('.toast-icon').textContent = TOAST_ICONS[t];
                    el.querySelector('.toast-title').textContent = ti;
                    el.querySelector('.toast-msg').textContent = m;
                    el.querySelector('.toast-bar')?.remove();
                    if (d) {
                        const bar = document.createElement('div');
                        bar.className = 'toast-bar';
                        bar.style.animationDuration = d + 'ms';
                        el.appendChild(bar);
                        timer = setTimeout(close, d);
                    }
                },
            };
        }

        // ===== Files =====
        async function loadFiles() {
            const listEl = document.getElementById('fileList');
            try {
                const res = await fetch('/api/files');
                if (!res.ok) throw new Error('Request failed');
                const data = await res.json();

                if (data.files && data.files.length > 0) {
                    listEl.innerHTML = data.files.map(f => `
                        <div class="flex items-center space-x-2 p-2 bg-white rounded-lg border border-[#e6dfd5] text-xs font-medium text-[#2c2522]">
                            <span>📄</span>
                            <span class="truncate flex-1">${escapeHtml(f)}</span>
                            <button type="button" data-file="${escapeHtml(f)}" class="delete-file text-gray-400 hover:text-red-600 text-base leading-none" aria-label="Remove ${escapeHtml(f)}">×</button>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = '<p class="text-gray-400 text-xs italic">No documents uploaded yet.</p>';
                }
            } catch (err) {
                console.error('Failed to load files:', err);
                showToast({ type: 'error', title: 'Could not load documents', message: 'Is the server running?' });
            }
        }

        async function uploadFiles(fileList) {
            const files = Array.from(fileList);   // copy before resetting the input
            document.getElementById('fileInput').value = '';
            if (!files.length) return;

            const formData = new FormData();
            files.forEach(file => formData.append('files', file));

            const label = files.length === 1 ? files[0].name : `${files.length} files`;
            const t = showToast({ type: 'loading', title: 'Indexing…', message: label, duration: 0 });

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                let body = {};
                try { body = await res.json(); } catch (_) {}
                await loadFiles();

                if (res.ok && !(body.errors && body.errors.length)) {
                    t.update({ type: 'success', title: 'Ready to chat', message: 'Vault synchronized successfully.' });
                } else if (res.ok) {
                    t.update({ type: 'error', title: `Indexed ${body.indexed}, skipped some`, message: body.errors.join('; '), duration: 7000 });
                } else {
                    const msg = typeof body.detail === 'string' ? body.detail : 'Check the file formats and try again.';
                    t.update({ type: 'error', title: 'Upload failed', message: msg, duration: 7000 });
                }
            } catch (err) {
                t.update({ type: 'error', title: 'Upload failed', message: 'Could not reach the server.' });
            }
        }

        async function deleteFile(name) {
            try {
                const res = await fetch('/api/files/' + encodeURIComponent(name), { method: 'DELETE' });
                if (!res.ok) throw new Error('Delete failed');
                await loadFiles();
                showToast({ type: 'success', title: 'Removed', message: name, duration: 3000 });
            } catch (err) {
                showToast({ type: 'error', title: 'Could not remove file', message: name });
            }
        }

        // Event delegation: file names never go inside inline onclick handlers
        document.getElementById('fileList').addEventListener('click', e => {
            const btn = e.target.closest('.delete-file');
            if (btn) deleteFile(btn.dataset.file);
        });

        // ===== Chat =====
        async function sendQuery(e) {
            e.preventDefault();
            const input = document.getElementById('queryInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            const feed = document.getElementById('chatFeed');
            if (feed.querySelector('.text-center')) feed.innerHTML = '';

            feed.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-[#2c2522] text-white rounded-2xl px-4 py-3 max-w-lg text-sm shadow">
                        ${escapeHtml(prompt)}
                    </div>
                </div>
            `;
            input.value = '';
            feed.scrollTop = feed.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            feed.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-white border border-[#e6dfd5] rounded-2xl px-5 py-4 max-w-xl text-sm shadow-sm animate-pulse text-gray-400">
                        Searching vault knowledge nodes...
                    </div>
                </div>
            `;
            feed.scrollTop = feed.scrollHeight;

            try {
                const res = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                if (!res.ok) {
                    let detail = 'Query failed';
                    try { const err = await res.json(); if (typeof err.detail === 'string') detail = err.detail; } catch (_) {}
                    throw new Error(detail);
                }
                const data = await res.json();

                document.getElementById(loadingId).remove();

                let badges = '';
                if (data.sources && data.sources.length > 0) {
                    // Show each file once, even if several chunks came from it
                    const seen = new Set();
                    const uniqueSources = data.sources.filter(s => !seen.has(s.file_name) && seen.add(s.file_name));

                    badges = '<div class="mt-3 pt-3 border-t border-gray-100 flex flex-wrap gap-2">';
                    uniqueSources.forEach(src => {
                        badges += `<span class="bg-[#f0ebe1] border border-[#e3dbd0] text-[#5c524b] px-2 py-1 rounded-md text-xs font-medium">📖 ${escapeHtml(src.file_name)}</span>`;
                    });
                    badges += '</div>';

                    const top = data.sources[0];
                    document.getElementById('sourceInspector').innerHTML = `
                        <div class="font-bold text-gray-900 mb-1">${escapeHtml(top.file_name)}</div>
                        <div class="text-green-600 font-semibold mb-2">Relevance Score: ${Number(top.score).toFixed(4)}</div>
                        <hr class="my-2 border-gray-200">
                        <p class="leading-relaxed">${escapeHtml(top.text)}</p>
                    `;
                } else {
                    document.getElementById('sourceInspector').innerHTML = INSPECTOR_PLACEHOLDER;
                }

                feed.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-white border border-[#e6dfd5] rounded-2xl px-5 py-4 max-w-xl text-sm shadow-sm text-[#2c2522]">
                            <div class="leading-relaxed">${escapeHtml(data.answer).replace(/\n/g, '<br>')}</div>
                            ${badges}
                        </div>
                    </div>
                `;
                feed.scrollTop = feed.scrollHeight;

            } catch (err) {
                const loadingEl = document.getElementById(loadingId);
                if (loadingEl) loadingEl.innerHTML = `<span class="text-red-500 text-sm">Error processing query.</span>`;
                showToast({ type: 'error', title: 'Query failed', message: err.message || 'Could not reach the knowledge vault.' });
            }
        }

        // Load the file list once when the page opens
        loadFiles();
    </script>
</body>
</html>
